<div class="task-page">

  <div class="Title">
    <h1>Gestionnaires de tâches</h1>
  </div>

  <div class="task-header">
    <button class="btn btn-primary" (click)="addTask()">
      + Ajouter une tâche
    </button>
  </div>

  <div class="task-toolbar">
    <div class="search-box">
      <input type="text"
             placeholder="Rechercher une tâche..."
             [(ngModel)]="searchTerm" />
    </div>
    
    <div class="filters">

      <select [(ngModel)]="selectedStatus">
        <option value="">Tous les statuts</option>
        <option value="Todo">À faire</option>
        <option value="Done">Terminée</option>
      </select>

      <select [(ngModel)]="selectedPriority">
        <option value="">Toutes les priorités</option>
        <option [value]="TaskPriority.LOW">Low</option>
        <option [value]="TaskPriority.MEDIUM">Medium</option>
        <option [value]="TaskPriority.HIGH">High</option>
      </select>


      <div class="task-count">
        {{filteredTasks().length}} / {{tasks.length}} tâches affichées
      </div>
    </div>

  </div>

  <div class="task-list">

    <div class="task-card" *ngFor="let task of filteredTasks()">
      <div class="task-left">

        <label class="custom-checkbox">
          <input  type="checkbox"
                 [checked]="task.iscompleted"
                 (change)="toggleTaskStatus(task)" />
          <span class="checkmark"></span>
        </label>

        <div class="task-content"
             ngClass]="{'task-overdue': isOverdue(task)}">
          <h3 [class.completed]="task.iscompleted">
            {{ task.title }} ({{task.priority}})
          </h3>


          <div class="task-meta">
            <span class="badge todo" *ngIf="!task.iscompleted">À faire</span>
            <span class="badge done" *ngIf="task.iscompleted">Terminée</span>

            <span class="due-date" *ngIf="task.dueDate">
              Échéance : {{ task.dueDate }}
            </span>
          </div>
        </div>
      </div>

      <div class="task-actions">
        <button class="btn btn-secondary" (click)="editTask(task)">
          Modifier
        </button>
        <button class="btn btn-danger" (click)="deleteTask(task.id)">
          Supprimer
        </button>
      </div>
    </div>

    <div class="empty-state" *ngIf="filteredTasks().length === 0">
      <h3>Aucune tâche trouvée</h3>
      <p>Ajoute une tâche ou modifie tes filtres.</p>
    </div>
  </div>

</div>

<footer>
  <div class="tokenExpiration">
    <p>La session expire dans : {{ remainingTime }} </p>
    <button class="BoutonQuitter" (click)="logout()">Quitter</button>
  </div>
</footer>
