<div class="task-form-page">
  <h1>{{ isEditMode ? 'Modifier une tâche' : 'Créer une tâche' }}</h1>

  <div class="form-group">
    <label for="title">Titre</label>
    <input id="title" type="text" [(ngModel)]="task.title" />
  </div>

  <div class="form-group">
    <label for="DueDate">Date d'échéance'</label>
    <input type="date" id="DueDate" [(ngModel)]="task.dueDate" />
  </div>


  <div class="form-group">
    <label for="priority">Priorité</label>

    <select id="priority" [(ngModel)]="task.priority">

      <option [ngValue]="TaskPriority.LOW">Low</option>
      <option [ngValue]="TaskPriority.MEDIUM">Medium</option>
      <option [ngValue]="TaskPriority.HIGH">High</option>

    </select>
  </div>

  <div class="actions">
    <button (click)="save()">Enregistrer</button>
    <button type="button" (click)="cancel()">Annuler</button>
  </div>
</div>
